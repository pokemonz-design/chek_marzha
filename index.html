<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чек-лист CFO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f1ec;
      font-family: Georgia, "Times New Roman", serif;
      color: #111;
    }

    .checklist-widget {
      width: 757px;
      height: 520px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #eee9dd;
      overflow: hidden;
    }

    .content {
      padding: 24px 30px 20px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .kicker {
      margin-bottom: 5px;
      color: #b69118;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    h2 {
      margin: 0 0 7px;
      font-size: 19px;
      line-height: 1.1;
      letter-spacing: -0.25px;
    }

    .intro {
      margin: 0 0 13px;
      max-width: 670px;
      font-size: 14px;
      line-height: 1.35;
    }

    .progress-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }

    .progress-track {
      height: 6px;
      background: #e6e0d3;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: #b69118;
      transition: width 0.25s ease;
    }

    .progress-text {
      min-width: 92px;
      text-align: right;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #666;
    }

    .checklist {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 22px;
      flex: 1;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid #eee9dd;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.25;
    }

    .item input {
      margin: 2px 0 0;
      width: 18px;
      height: 18px;
      accent-color: #b69118;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .item label {
      cursor: pointer;
    }

    .footer {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .status {
      max-width: 390px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.3;
      color: #555;
    }

    .status strong {
      color: #b69118;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    button {
      height: 34px;
      padding: 0 15px;
      border: 0;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
    }

    .print-btn,
    .download-btn {
      background: #b69118;
      color: #fff;
    }

    .reset-btn {
      background: #fff;
      color: #222;
      border: 1px solid #cfc8b7;
    }

    @media print {
      body {
        background: #fff;
      }

      .checklist-widget {
        width: 100%;
        height: auto;
        border: 0;
      }

      .content {
        height: auto;
        padding: 0;
      }

      .buttons {
        display: none;
      }

      .item {
        font-size: 14px;
      }

      .progress-track {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .progress-bar {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>

<body>

<div class="checklist-widget">

  <div class="content">

    <div class="kicker">Проверьте систему контроля</div>

    <h2>Защищает ли компания маржу при росте продаж</h2>

    <p class="intro">
      Отметьте работающие механизмы. Прогресс покажет, сколько ключевых зон контроля уже закрыто.
    </p>

    <div class="progress-row">
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="progress-text" id="progressText">
        0 из 12
      </div>
    </div>

    <div class="checklist" id="checklist">

      <div class="item">
        <input type="checkbox" id="c1">
        <label for="c1">
          ERP блокирует сделки ниже минимальной цены или требует согласования.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c2">
        <label for="c2">
          Финансы видят отклонение фактической цены от прайса.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c3">
        <label for="c3">
          Маржинальный доход считают по продуктам, клиентам и каналам.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c4">
        <label for="c4">
          Компания контролирует долю низкомаржинальных продаж.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c5">
        <label for="c5">
          Себестоимость пересчитывают при существенном изменении ресурсов.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c6">
        <label for="c6">
          Новые заказы оценивают по актуальной или прогнозной себестоимости.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c7">
        <label for="c7">
          Логистику относят на конкретных клиентов и направления.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c8">
        <label for="c8">
          Нестандартные операции включают в экономику сделки.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c9">
        <label for="c9">
          KPI руководителей учитывают маржу, а не только объем и выручку.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c10">
        <label for="c10">
          Крупные решения оценивают по влиянию на всю цепочку бизнеса.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c11">
        <label for="c11">
          Бонусы, возвраты и маркетинговые выплаты относят на клиента.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c12">
        <label for="c12">
          Итоговую маржу пересчитывают после всех расходов по сделке.
        </label>
      </div>

    </div>

    <div class="footer">

      <div class="status" id="status">
        Отметьте пункты, которые уже работают в компании.
      </div>

      <div class="buttons">
        <button class="reset-btn" id="resetBtn">
          Сбросить
        </button>

        <button class="download-btn" id="downloadBtn">
          Скачать
        </button>

        <button class="print-btn" id="printBtn">
          Распечатать
        </button>
      </div>

    </div>

  </div>
</div>

<script>
  const checkboxes = [...document.querySelectorAll(
    '#checklist input[type="checkbox"]'
  )];

  const progressBar = document.getElementById("progressBar");
  const progressText = document.getElementById("progressText");
  const status = document.getElementById("status");

  function updateProgress() {
    const checked = checkboxes.filter(item => item.checked).length;
    const total = checkboxes.length;
    const percent = Math.round((checked / total) * 100);

    progressBar.style.width = percent + "%";
    progressText.textContent = `${checked} из ${total}`;

    if (checked === 0) {
      status.innerHTML =
        "Отметьте пункты, которые уже работают в компании.";
    } else if (checked <= 4) {
      status.innerHTML =
        "<strong>Высокий риск.</strong> Большая часть контроля пока не формализована.";
    } else if (checked <= 8) {
      status.innerHTML =
        "<strong>Есть пробелы.</strong> Часть потерь может обнаруживаться слишком поздно.";
    } else if (checked < total) {
      status.innerHTML =
        "<strong>Хороший уровень.</strong> Осталось закрыть отдельные зоны риска.";
    } else {
      status.innerHTML =
        "<strong>Все ключевые зоны закрыты.</strong> Проверьте, работают ли механизмы на практике.";
    }
  }

  checkboxes.forEach(item => {
    item.addEventListener("change", updateProgress);
  });

  document.getElementById("resetBtn")
    .addEventListener("click", () => {
      checkboxes.forEach(item => item.checked = false);
      updateProgress();
    });

  document.getElementById("printBtn")
    .addEventListener("click", () => {
      window.print();
    });

  document.getElementById("downloadBtn")
    .addEventListener("click", () => {
      const rows = checkboxes.map((item, index) => {
        const label = document.querySelector(`label[for="${item.id}"]`).innerText.trim();
        const mark = item.checked ? "ДА" : "НЕТ";
        return `${index + 1}. [${mark}] ${label}`;
      });

      const checked = checkboxes.filter(item => item.checked).length;

      const text =
`ЧЕК-ЛИСТ CFO
Защищает ли компания маржу при росте продаж

Результат: ${checked} из ${checkboxes.length}

${rows.join("\n")}

Сформировано из интерактивного чек-листа статьи.`;

      const blob = new Blob([text], {
        type: "text/plain;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "checklist-cfo-margin.txt";

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    });

  updateProgress();
</script>

</body>
</html>
