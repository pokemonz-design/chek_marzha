<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чек-лист CFO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f1ec;
      font-family: Georgia, "Times New Roman", serif;
      color: #111;
    }

    .checklist-widget {
      width: 757px;          /* фиксированная ширина */
      height: 530px;         /* фиксированная высота */
      margin: 0 auto;
      background: #fff;
      border: 1px solid #eee9dd;
      overflow: hidden;      /* скрываем всё, что выходит за пределы */
    }

    .content {
      padding: 25px 30px 20px;
      height: 100%;          /* занимает всю высоту виджета */
      display: flex;
      flex-direction: column;
    }

    .kicker {
      margin-bottom: 4px;
      color: #b69118;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    h2 {
      margin: 0 0 5px;
      font-size: 28px;
      line-height: 1.04;
      letter-spacing: -0.7px;
    }

    .intro {
      margin: 0 0 10px;
      font-size: 16px;        /* увеличен на 20% (было 13px) */
      line-height: 1.3;
      max-width: 650px;
    }

    .checklist {
      flex: 1;              /* занимает всё доступное пространство */
      min-height: 0;        /* важно для Firefox, чтобы работал overflow */
      overflow-y: auto;     /* внутренняя прокрутка списка */
      display: flex;
      flex-direction: column;
      gap: 12px 0;          /* увеличенные интервалы между пунктами */
      padding-right: 4px;   /* чтобы скролл не наезжал на текст */
    }

    .item {
      display: flex;
      align-items: center;   /* выравнивание по вертикали по центру */
      gap: 8px;
      padding: 10px 0;      /* увеличенный вертикальный отступ внутри пункта */
      border-bottom: 1px solid #eee9dd;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.3;
    }

    .item input {
      margin: 0;            /* убираем верхний отступ, центрирование за счёт flex */
      accent-color: #b69118;
      cursor: pointer;
      transform: scale(1.3);
      transform-origin: center left;
    }

    .item label {
      cursor: pointer;
    }

    .footer {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .status {
      font-family: Arial, sans-serif;
      font-size: 11px;
      line-height: 1.25;
      color: #555;
    }

    .status strong {
      color: #b69118;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      height: 32px;
      padding: 0 14px;
      border: 0;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
    }

    .print-btn {
      background: #b69118;
      color: #fff;
    }

    .pdf-btn {
      background: #b69118;
      color: #fff;
    }

    .reset-btn {
      background: #fff;
      color: #222;
      border: 1px solid #cfc8b7;
    }

    /* При печати отключаем фиксированную высоту и прокрутку */
    @media print {
      body {
        background: #fff;
      }

      .checklist-widget {
        width: 100%;
        height: auto;
        border: 0;
        overflow: visible;
      }

      .buttons {
        display: none !important;
      }

      .content {
        height: auto;
        padding: 10px;
      }

      .checklist {
        overflow: visible;
        flex: none;
        gap: 6px 0;
      }

      .item {
        font-size: 12px;
        padding: 5px 0;
        transform: none;
      }

      .item input {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

<div class="checklist-widget">

  <div class="content">

    <div class="kicker">Проверьте систему контроля</div>

    <h2>Защищает ли компания маржу при росте продаж</h2>

    <p class="intro">
      Отметьте пункты, которые выполняются в вашей компании
    </p>

    <div class="checklist" id="checklist">

      <div class="item">
        <input type="checkbox" id="c1">
        <label for="c1">
          ERP блокирует сделки ниже минимальной цены или требует согласования.
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c2">
        <label for="c2">
          Финансы видят отклонение фактической цены от прайса
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c3">
        <label for="c3">
          Маржинальный доход считают по продуктам, клиентам и каналам
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c4">
        <label for="c4">
          Компания контролирует долю низкомаржинальных продаж
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c5">
        <label for="c5">
          Себестоимость пересчитывают при существенном изменении ресурсов
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c6">
        <label for="c6">
          Новые заказы оценивают по актуальной или прогнозной себестоимости
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c7">
        <label for="c7">
          Логистику относят на конкретных клиентов и направления
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c8">
        <label for="c8">
          Нестандартные операции включают в экономику сделки
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c9">
        <label for="c9">
          KPI руководителей учитывают маржу, а не только объем и выручку
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c10">
        <label for="c10">
          Крупные решения оценивают по влиянию на всю цепочку бизнеса
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c11">
        <label for="c11">
          Бонусы, возвраты и маркетинговые выплаты относят на клиента
        </label>
      </div>

      <div class="item">
        <input type="checkbox" id="c12">
        <label for="c12">
          Итоговую маржу пересчитывают после всех расходов по сделке
        </label>
      </div>

    </div>

    <div class="footer">

      <div class="status" id="status">
        Отметьте пункты, которые уже работают в компании.
      </div>

      <div class="buttons">
        <button class="reset-btn" id="resetBtn">
          Сбросить
        </button>

        <button class="pdf-btn" id="savePdfBtn">
          Сохранить в PDF
        </button>

        <button class="print-btn" id="printBtn">
          Распечатать чек-лист
        </button>
      </div>

    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
  const checkboxes = [...document.querySelectorAll(
    '#checklist input[type="checkbox"]'
  )];

  const status = document.getElementById("status");

  function updateProgress() {
    const checked = checkboxes.filter(item => item.checked).length;
    const total = checkboxes.length;

    if (checked === 0) {
      status.innerHTML = "";
    } else if (checked <= 4) {
      status.innerHTML =
        "<strong>Высокий риск.</strong> Большая часть контроля пока не формализована.";
    } else if (checked <= 8) {
      status.innerHTML =
        "<strong>Есть пробелы.</strong> Часть потерь может обнаруживаться слишком поздно.";
    } else if (checked < total) {
      status.innerHTML =
        "<strong>Хороший уровень.</strong> Осталось закрыть отдельные зоны риска.";
    } else {
      status.innerHTML =
        "<strong>Все ключевые зоны закрыты.</strong> Проверьте, работают ли механизмы на практике.";
    }
  }

  checkboxes.forEach(item => {
    item.addEventListener("change", updateProgress);
  });

  document.getElementById("resetBtn")
    .addEventListener("click", () => {
      checkboxes.forEach(item => item.checked = false);
      updateProgress();
    });

  document.getElementById("printBtn")
    .addEventListener("click", () => {
      window.print();
    });

  document.getElementById("savePdfBtn")
    .addEventListener("click", async () => {
      const element = document.querySelector(".checklist-widget");
      const buttons = document.querySelector(".buttons");
      const checklist = document.getElementById("checklist");

      if (typeof html2pdf === "undefined") {
        alert("Не удалось загрузить библиотеку для PDF. Проверьте интернет-соединение.");
        return;
      }

      // Сохраняем исходные стили
      const originalButtonDisplay = buttons.style.display;
      const originalWidgetHeight = element.style.height;
      const originalWidgetOverflow = element.style.overflow;
      const originalChecklistOverflow = checklist.style.overflow;

      // Временно отключаем ограничения, чтобы весь список попал в PDF
      buttons.style.display = "none";
      element.style.height = "auto";
      element.style.overflow = "visible";
      checklist.style.overflow = "visible";

      const options = {
        margin: 0,
        filename: "cheklist-cfo.pdf",
        image: { type: "jpeg", quality: 0.98 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          backgroundColor: "#ffffff"
        },
        jsPDF: {
          unit: "mm",
          format: "a4",
          orientation: "portrait"
        },
        exclude: [".buttons"]
      };

      try {
        await html2pdf().set(options).from(element).save();
      } catch (error) {
        console.error(error);
        alert("Не удалось сохранить PDF.");
      } finally {
        // Возвращаем исходные стили
        buttons.style.display = originalButtonDisplay;
        element.style.height = originalWidgetHeight;
        element.style.overflow = originalWidgetOverflow;
        checklist.style.overflow = originalChecklistOverflow;
      }
    });

  updateProgress();
</script>

</body>
</html>
